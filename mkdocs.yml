site_name: karakeep-trilium-sync
site_description: Copy Karakeep bookmarks into Trilium notes.
site_url: https://marceltov.github.io/karakeep-trilium-sync/
repo_url: https://github.com/Marceltov/karakeep-trilium-sync
repo_name: Marceltov/karakeep-trilium-sync
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Marcel Bruckner. Licensed under <a href="https://github.com/Marceltov/karakeep-trilium-sync/blob/main/LICENSE">AGPL-3.0-or-later</a>

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Configuration: configuration.md
  - What gets imported: what-gets-imported.md
  - Reddit: reddit.md
  - Operations: operations.md
  - Contributing: contributing.md

theme:
  name: material
  logo: logo.svg
  favicon: logo.svg
  font:
    text: Atkinson Hyperlegible Next
    code: Atkinson Hyperlegible Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid@11.12.0/dist/mermaid.min.js
  - javascripts/mermaid.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
